<IfModule !mod_dims.c>
    LoadModule dims_module modules/libmod_dims.so
</IfModule>

# root owns the installation and the server writes nothing inside it, so the
# pid file goes to a writable path and the logs go to the container's streams.
PidFile /tmp/httpd.pid
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 common

# Worker pool. The entrypoint sizes ServerLimit, ThreadsPerChild, and
# MaxRequestWorkers from the container's CPU allocation, so a larger container
# scales without a change here. A soak test found that throughput peaks near
# one worker per vCPU, with two threads per child split across processes. Set
# DIMS_SERVER_LIMIT, DIMS_THREADS_PER_CHILD, or DIMS_MAX_WORKERS to a number to
# pin one. MaxConnectionsPerChild recycles a child after many connections, so
# its memory returns to the system.
<IfModule mpm_event_module>
    ServerLimit            ${DIMS_SERVER_LIMIT}
    StartServers           ${DIMS_SERVER_LIMIT}
    ThreadLimit            ${DIMS_THREADS_PER_CHILD}
    ThreadsPerChild        ${DIMS_THREADS_PER_CHILD}
    MinSpareThreads        1
    MaxSpareThreads        ${DIMS_MAX_WORKERS}
    MaxRequestWorkers      ${DIMS_MAX_WORKERS}
    MaxConnectionsPerChild ${DIMS_MAX_CONNECTIONS_PER_CHILD}
</IfModule>

DimsDownloadTimeout ${DIMS_DOWNLOAD_TIMEOUT}
DimsImagemagickTimeout ${DIMS_IMAGEMAGICK_TIMEOUT}

# The largest source image to accept, in bytes. A larger source is refused
# before it is decoded. 0 means no limit.
DimsMaxSourceBytes ${DIMS_MAX_SOURCE_BYTES}

# Apply the host allowlist to a signed request and to a redirect. The default
# is log, so a signed request reaches any host. Set DIMS_ALLOWLIST_SIGNED to
# enforce to hold a signed request to the allowlist, once DIMS_WHITELIST covers
# your origins.
DimsAllowlistSigned ${DIMS_ALLOWLIST_SIGNED}

# Refuse a fetch to a private or loopback address. The default is off. Set
# DIMS_ALLOW_PRIVATE_ADDRESSES to On when the origin is on a private network.
DimsAllowPrivateAddresses ${DIMS_ALLOW_PRIVATE_ADDRESSES}

# The status page reports counters. The default drops the component versions.
DimsStatusVerbose ${DIMS_STATUS_VERBOSE}

# DimsClient <appId> [<noImageUrl> <cache control max-age> <edge control downstream-ttl> <trustSource?> <minSourceCache> <maxSourceCache> <password>]
DimsAddClient ${DIMS_CLIENT} ${DIMS_NO_IMAGE_URL} ${DIMS_CACHE_CONTROL_MAX_AGE} ${DIMS_EDGE_CONTROL_DOWNSTREAM_TTL} ${DIMS_TRUST_SOURCE} ${DIMS_MIN_SOURCE_CACHE} ${DIMS_MAX_SOURCE_CACHE} ${DIMS_SECRET}

DimsDefaultImageURL ${DIMS_DEFAULT_IMAGE_URL}
DimsCacheExpire ${DIMS_CACHE_EXPIRE}
DimsNoImageCacheExpire ${DIMS_NO_IMAGE_CACHE_EXPIRE}
DimsUserAgentEnabled true

# Decrypt the eurl parameter with AES-GCM, which is authenticated. The default
# is AES/GCM/NoPadding. Set DIMS_ENCRYPTION_ALGORITHM to AES/ECB/PKCS5Padding
# only for a client that still encrypts with it.
DimsEncryptionAlgorithm ${DIMS_ENCRYPTION_ALGORITHM}

# A single dash means no key, and every /dims5/ request is then refused.
DimsSigningKey ${DIMS_SIGNING_KEY}

# The allowlist decides which hosts a request may fetch from. DIMS_WHITELIST
# defaults to empty in the Dockerfile, and an empty allowlist matches nothing,
# so set it before the service can fetch a source.
DimsAddWhitelist ${DIMS_WHITELIST}

## Handler definitions. ##

<Location /dims5/>
    SetHandler dims5
</Location>

<Location /dims3/>
    SetHandler dims3
</Location>

<Location /dims4/>
    SetHandler dims4
</Location>

<Location /dims-status/>
    SetHandler dims-status
</Location>
