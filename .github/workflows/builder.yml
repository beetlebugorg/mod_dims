name: Builder image

# The toolchain mod_dims builds against: httpd, APR, libcurl, and ImageMagick
# compiled at quantum depth 8. Publishing it keeps ImageMagick out of every
# pull request run, which is minutes each time.
#
# It rebuilds when Dockerfile.builder changes, and on request.

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.builder'
      - '.github/workflows/builder.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/beetlebugorg/mod_dims

jobs:
  # Each architecture builds on a runner of that architecture. Building both on
  # one runner means emulating the other, and compiling ImageMagick under QEMU
  # takes tens of minutes for a result a native runner produces in a few.
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the ImageMagick version
        id: version
        run: |
          version=$(sed -n 's/^ARG IMAGEMAGICK_VERSION=//p' Dockerfile.builder)
          echo "tag=builder-im${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.builder
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}:${{ steps.version.outputs.tag }}-${{ matrix.arch }}

  # One name that resolves to whichever architecture asks for it.
  manifest:
    name: Publish the manifest
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the ImageMagick version
        id: version
        run: |
          version=$(sed -n 's/^ARG IMAGEMAGICK_VERSION=//p' Dockerfile.builder)
          echo "tag=builder-im${version}" >> "$GITHUB_OUTPUT"

      - name: Join the architectures
        run: |
          tag="${{ steps.version.outputs.tag }}"
          docker buildx imagetools create \
            -t "${REGISTRY}:${tag}" \
            -t "${REGISTRY}:builder" \
            "${REGISTRY}:${tag}-amd64" \
            "${REGISTRY}:${tag}-arm64"
          docker buildx imagetools inspect "${REGISTRY}:${tag}"
