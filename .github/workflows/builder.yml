name: Toolchain

# The toolchain mod_dims builds against: httpd, APR, libcurl, and ImageMagick
# compiled at quantum depth 8. Publishing it keeps ImageMagick out of every
# pull request run, which is minutes each time.
#
# It rebuilds when docker/Dockerfile.builder changes, and on request.

on:
  push:
    branches:
      - main
    paths:
      - 'docker/Dockerfile.builder'
      - '.github/workflows/builder.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/beetlebugorg/mod_dims

jobs:
  # Each architecture builds on a runner of that architecture. Building both on
  # one runner means emulating the other, and compiling ImageMagick under QEMU
  # takes tens of minutes for a result a native runner produces in a few.
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the toolchain tag
        id: version
        run: |
          version=$(sed -n 's/^ARG IMAGEMAGICK_VERSION=//p' docker/Dockerfile.builder)
          revision=$(sed -n 's/^ARG BUILDER_REVISION=//p' docker/Dockerfile.builder)
          echo "tag=builder-im${version}-r${revision}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.builder
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}:${{ steps.version.outputs.tag }}-${{ matrix.arch }}
          # No provenance attestation. With it, each per architecture tag is an
          # index holding the image plus an unknown/unknown manifest. Joining
          # two of those collides on the attestations and drops an
          # architecture: the first publish produced an index with amd64 and an
          # attestation, and no arm64 at all.
          provenance: false

  # The tag both architectures resolve through.
  manifest:
    name: Manifest
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the toolchain tag
        id: version
        run: |
          version=$(sed -n 's/^ARG IMAGEMAGICK_VERSION=//p' docker/Dockerfile.builder)
          revision=$(sed -n 's/^ARG BUILDER_REVISION=//p' docker/Dockerfile.builder)
          echo "tag=builder-im${version}-r${revision}" >> "$GITHUB_OUTPUT"

      - name: Merge the manifest
        run: |
          tag="${{ steps.version.outputs.tag }}"
          docker buildx imagetools create \
            -t "${REGISTRY}:${tag}" \
            -t "${REGISTRY}:builder" \
            "${REGISTRY}:${tag}-amd64" \
            "${REGISTRY}:${tag}-arm64"
          docker buildx imagetools inspect "${REGISTRY}:${tag}"

      # A joined manifest that lost an architecture still pulls on the one it
      # kept, so nothing downstream would notice until an arm64 runner fell
      # back to building the toolchain itself. Check both are there.
      - name: Check the manifest
        run: |
          tag="${{ steps.version.outputs.tag }}"
          manifest=$(docker buildx imagetools inspect "${REGISTRY}:${tag}" --raw)
          for arch in amd64 arm64; do
            echo "$manifest" | grep -q "\"architecture\": \"${arch}\"" || {
              echo "the manifest has no ${arch} entry"
              echo "$manifest"
              exit 1
            }
            echo "${arch} present"
          done
