name: Builder image

# The toolchain mod_dims builds against: httpd, APR, libcurl, and ImageMagick
# compiled at quantum depth 8. Publishing it keeps ImageMagick out of every
# pull request run, which is minutes each time.
#
# It rebuilds when Dockerfile.builder changes, and on request.

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.builder'
      - '.github/workflows/builder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag carries the ImageMagick version, read from the file that sets
      # it, so the tag and the toolchain cannot disagree.
      - name: Read the ImageMagick version
        id: version
        run: |
          version=$(sed -n 's/^ARG IMAGEMAGICK_VERSION=//p' Dockerfile.builder)
          echo "tag=builder-im${version}" >> "$GITHUB_OUTPUT"
          echo "publishing builder-im${version}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.builder
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/beetlebugorg/mod_dims:${{ steps.version.outputs.tag }}
            ghcr.io/beetlebugorg/mod_dims:builder
