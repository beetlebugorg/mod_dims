name: Docs CI

# The site has to build before a documentation change merges. It does not
# deploy from here.

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-*.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
