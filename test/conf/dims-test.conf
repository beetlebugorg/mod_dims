# Fixed configuration for the test harness. No environment variables: the
# golden files record what this exact configuration produces.

<IfModule !mod_dims.c>
    LoadModule dims_module modules/libmod_dims.so
</IfModule>

# The profiles are not installed in the test image, so point at the tree.
DimsProfileDir /build/mod_dims/profiles

LogLevel warn
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 common

DimsDownloadTimeout 10000
DimsImagemagickTimeout 20000

# DimsAddClient <appId> <noImageUrl> <max-age> <downstream-ttl> <trust> <minSrc> <maxSrc> <secret>
DimsAddClient TEST http://origin:8080/grid.png 604800 604800 trust 300 86400 t3stk3y
DimsAddClient NOKEY - 604800 604800 - - - -

DimsDefaultImageURL http://origin:8080/grid.png
DimsCacheExpire 604800
DimsNoImageCacheExpire 60
DimsUserAgentEnabled true

# The origin service is the only host a test may reach.
DimsAddWhitelist origin

<Location /dims3/>
    SetHandler dims3
</Location>

<Location /dims4/>
    SetHandler dims4
</Location>

<Location /dims-status/>
    SetHandler dims-status
</Location>

# A location the server denies. A /dims3/ request that names a local file here
# must not read it: the module honors the access check the subrequest runs.
<Location /protected/>
    Require all denied
</Location>

# The dims4 handler under a location it cannot read. It indexes a fixed number
# of bytes into the URI, so this must be refused rather than read past.
<Location /i/>
    SetHandler dims4
</Location>

# A second server with no error image.
#
# dims_cleanup only reaches its status return when there is no error image to
# send. Every client above has one, through DimsDefaultImageURL, so the whole
# path is unreachable from port 8000 and a change to it looks like a change to
# nothing.
#
# The module registers no server merge function, so a virtual host starts from
# the defaults rather than inheriting. That is what makes this work: no
# DimsDefaultImageURL here means no error image, and a failure has only its
# status to report with.
Listen 8001

<VirtualHost *:8001>
    ServerName noerrorimage

    DimsAddClient TEST - 604800 604800 trust 300 86400 t3stk3y
    DimsAddWhitelist origin

    <Location /dims3/>
        SetHandler dims3
    </Location>

    <Location /dims4/>
        SetHandler dims4
    </Location>
</VirtualHost>

# A third server, with a source size limit set.
#
# The limit defaults to no limit, so the servers above cannot exercise it.
Listen 8002

<VirtualHost *:8002>
    ServerName sizelimited

    DimsMaxSourceBytes 1048576

    DimsAddClient TEST http://origin:8080/grid.png 604800 604800 trust 300 86400 t3stk3y
    DimsDefaultImageURL http://origin:8080/grid.png
    DimsAddWhitelist origin

    <Location /dims4/>
        SetHandler dims4
    </Location>
</VirtualHost>

# A fourth server, with the network guard set to its tightest values.
#
# The servers above run the shipped defaults, which is what proves the guard
# does not break a drop-in upgrade. Nothing there can exercise the two
# directives, so they get a server of their own.
#
# DimsAllowPrivateAddresses stays on here. The compose network hands out
# private addresses, so turning it off would refuse the fixture origin along
# with everything else. The case that turns it off uses port 8004.
Listen 8003

<VirtualHost *:8003>
    ServerName allowlistenforced

    DimsAllowlistSigned enforce

    DimsAddClient TEST http://origin:8080/grid.png 604800 604800 trust 300 86400 t3stk3y
    DimsDefaultImageURL http://origin:8080/grid.png
    DimsAddWhitelist origin

    <Location /dims3/>
        SetHandler dims3
    </Location>

    <Location /dims4/>
        SetHandler dims4
    </Location>
</VirtualHost>

# A fifth server, with private addresses refused.
#
# Every host on the compose network holds a private address, so this server
# can fetch nothing at all. That is the point: it shows the directive reaches
# the socket, and it is the /dims5/ default the plan records.
Listen 8004

<VirtualHost *:8004>
    ServerName noprivate

    DimsAllowPrivateAddresses off

    DimsAddClient TEST - 604800 604800 trust 300 86400 t3stk3y
    DimsAddWhitelist origin

    <Location /dims3/>
        SetHandler dims3
    </Location>

    <Location /dims4/>
        SetHandler dims4
    </Location>
</VirtualHost>

# A sixth server, for the status mapping and the status handler.
#
# DimsOriginStatusMode map turns an origin failure into one of three statuses
# instead of forwarding whatever the origin said. DimsStatusVerbose off drops
# the component versions from the status page. Both default to today's
# behavior, so no server above can exercise either.
#
# The download timeout is short here, so the case that asserts a timeout does
# not have to wait ten seconds for one.
Listen 8005

<VirtualHost *:8005>
    ServerName mapped

    DimsOriginStatusMode map
    DimsStatusVerbose off
    DimsDownloadTimeout 1000

    DimsAddClient TEST - 604800 604800 trust 300 86400 t3stk3y
    DimsAddWhitelist origin

    <Location /dims3/>
        SetHandler dims3
    </Location>

    <Location /dims4/>
        SetHandler dims4
    </Location>

    <Location /dims-status/>
        SetHandler dims-status
    </Location>

    # The sizer is not in the shipped configuration. It is enabled here so the
    # allowlist it gained has somewhere to run.
    <Location /dims-sizer/>
        SetHandler dims-sizer
    </Location>
</VirtualHost>

# A seventh server, running the commands over every frame.
#
# The default returns a multi-frame source unchanged, so no server above can
# exercise the other value.
Listen 8006

<VirtualHost *:8006>
    ServerName animated

    DimsAnimatedImages transform

    DimsAddClient TEST http://origin:8080/grid.png 604800 604800 trust 300 86400 t3stk3y
    DimsDefaultImageURL http://origin:8080/grid.png
    DimsAddWhitelist origin

    <Location /dims4/>
        SetHandler dims4
    </Location>
</VirtualHost>

# A seventh server, for /dims5/.
#
# The endpoint takes one signing key rather than a per client secret, and no
# client id in the URL.
Listen 8007

<VirtualHost *:8007>
    ServerName dims5

    DimsSigningKey 0123456789abcdef0123456789abcdef

    # A failed request answers with a drawn image at the requested size, so a
    # page keeps its layout.
    DimsErrorBackground "#cccccc"

    DimsAddWhitelist origin

    <Location /dims5/>
        SetHandler dims5
    </Location>
</VirtualHost>

Listen 8008

# A server that removes the handler from both legacy endpoints. A VirtualHost
# inherits the main server Location blocks, so SetHandler None is what removes
# them. The module dispatches on the handler, so httpd returns 404 for both.
<VirtualHost *:8008>
    ServerName legacyoff

    DimsAddClient TEST http://origin:8080/grid.png 604800 604800 trust 300 86400 t3stk3y
    DimsAddWhitelist origin

    <Location /dims3/>
        SetHandler None
    </Location>

    <Location /dims4/>
        SetHandler None
    </Location>
</VirtualHost>
