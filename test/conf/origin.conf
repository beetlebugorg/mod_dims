# mod_headers is not loaded by the stock httpd configuration.
LoadModule headers_module modules/mod_headers.so
LoadModule cgid_module modules/mod_cgid.so
LoadModule alias_module modules/mod_alias.so

# The fixture origin. It serves the images and the endpoints the tests need to
# exercise the fetch paths.

<Directory "/usr/local/apache2/htdocs">
    Require all granted
    Options -Indexes
</Directory>

AddType image/svg+xml .svg

# Cache headers the response tests read.
<Location /grid.png>
    Header set Cache-Control "max-age=3600"
    Header set ETag "\"fixture-grid\""
    Header set Last-Modified "Wed, 21 Oct 2015 07:28:00 GMT"
</Location>

# max-age above DimsAddClient's maxSrc, so the clamp is exercised.
<Location /pexels-photo-1539116.jpeg>
    Header set Cache-Control "max-age=99999999"
</Location>

# Status codes the error tests read.
RedirectMatch 404 ^/missing\.png$
RedirectMatch 500 ^/broken\.png$

# Redirect targets for the fetch guard cases. PR 16 makes mod_dims refuse
# every one of them.
Redirect 302 /redirect-notallowed http://notallowed:8080/grid.png
Redirect 302 /redirect-loopback http://127.0.0.1:8000/grid.png
Redirect 302 /redirect-loop http://origin:8080/redirect-loop

# A source far larger than any real image, for the size limit cases.
# 64 MB of zeros, generated on request rather than stored in the tree.
ScriptAlias /huge.png /usr/local/apache2/cgi-bin/huge.sh
