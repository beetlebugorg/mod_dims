# Prometheus and Grafana for watching a soak run.
#
#   bash test/endurance/observe/up.sh
#
# The soak creates dims-soak-net and gives its server the alias "dims", so
# Prometheus reaches it at dims:8001. Start the soak first.
name: dims-observe

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [soak]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    ports:
      # Every interface, so the dashboard is reachable from another machine.
      - "0.0.0.0:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks: [soak]
    depends_on: [prometheus]
    restart: unless-stopped

networks:
  soak:
    name: dims-soak-net
    external: true
